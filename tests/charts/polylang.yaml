wordpress:
  debug: true
  configExtra: |
    define('WP_ENVIRONMENT_TYPE', 'local');
  init:
    enabled: true
    existingSecret: "wordpress-test-secret"
    firstname: "Timon"
    lastname: "Först"
    title: "Polylang ACF translate test"
  language: "de_DE"
  plugins:
    - name: "ai-provider-for-llamacpp"
      activate: true
      autoupdate: true
    - name: "ai"
      activate: true
      autoupdate: true
    - name: "enable-abilities-for-mcp"
      activate: true
      autoupdate: true
